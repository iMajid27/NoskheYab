version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nuskhe_yab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nuskhe_yab
      POSTGRES_PASSWORD: nuskhe_yab_dev
      POSTGRES_DB: nuskhe_yab
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
